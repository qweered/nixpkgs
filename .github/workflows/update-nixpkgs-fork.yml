name: Update nixpkgs fork

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    uses: qweered/nix-update-fork/.github/workflows/sync.yml@main
    secrets:
      token: ${{ secrets.NIXPKGS_SYNC_TOKEN }}
    with:
      branches: |
        {
          "nixos-unstable": [
            "NixOS/nixpkgs#535346",
            "NixOS/nixpkgs#578391",
            "NixOS/nixpkgs#578415",
            "qweered/nixpkgs/7441b95afb6da774204d96a68969c4014af0fbc4",
            "qweered/nixpkgs/56f2db517358602108781ad1f5eb1fe1dd435b28"
          ]
        }
